  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
  /* =========================================================
     ÉTAT CIVIL : STYLE DOSSIER MACHINE À ÉCRIRE / RAPPORT
     ========================================================= */

  /* 1. Le conteneur : fond transparent, sans bordure ni ombre */
  .dossier-side .civil.card {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin-bottom: 24px !important;
  }

  /* 2. Le titre "État civil" : discret et dans le ton */
  .dossier-side .civil.card .label {
    font-family: 'Courier New', Courier, monospace !important;
    color: #c93b3b !important; /* Rouge archive / ruban encreur */
    font-size: 0.85rem !important;
    letter-spacing: 0.15em !important;
    text-transform: uppercase !important;
    border-bottom: 1px dashed rgba(201, 59, 59, 0.4) !important;
    padding-bottom: 4px !important;
    margin-bottom: 14px !important;
  }

  /* 3. Disposition des lignes */
  .dossier-side .civil.card .poster-fields {
    display: flex !important;
    flex-direction: column !important;
    gap: 8px !important;
  }

  .dossier-side .civil.card .poster-field {
    display: flex !important;
    flex-direction: row !important;
    align-items: baseline !important;
    gap: 12px !important;
    padding: 2px 0 !important;
    border: none !important;
    border-bottom: 1px dotted rgba(255, 255, 255, 0.08) !important; /* Ligne pointillée très discrète */
    font-family: 'Courier New', Courier, 'Special Elite', monospace !important;
  }

  /* 4. Les têtes de lignes (Nom, Naissance, Surnoms...) : ROUGE MACHINE */
  .dossier-side .civil.card .poster-field span,
  .dossier-side .civil.card .poster-field .civil-lbl {
    color: #d13a3a !important; /* Rouge tampon / machine à écrire */
    font-weight: 700 !important;
    font-size: 0.85rem !important;
    text-transform: uppercase !important;
    letter-spacing: 0.06em !important;
    min-width: 130px !important; /* Aligne proprement le début des textes */
    flex-shrink: 0 !important;
  }

  /* 5. Le texte des informations : NOIR MACHINE DACTYLO (bien net et lisible) */
  .dossier-side .civil.card .poster-field b,
  .dossier-side .civil.card .poster-field .civil-val {
    color: #111111 !important; /* Noir d'encre profond */
    font-weight: 600 !important;
    font-size: 0.95rem !important;
    line-height: 1.4 !important;
  }

  /* Ligne de séparation discrète adaptée au fond clair */
  .dossier-side .civil.card .poster-field {
    border-bottom: 1px dotted rgba(0, 0, 0, 0.2) !important;
  }
  /* --- CARROUSEL DE PORTRAITS --- */
  /* --- RECADRAGE ET ALIGNEMENT DU CARROUSEL --- */
  .portrait-slider {
    position: relative;
    width: 100%;
    margin: 0 auto;
    padding-top: 6px; /* Redescend proprement le visuel pour compenser le centimètre */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .portrait-slider .slide-item {
    display: none !important;
    width: 100%;
    padding: 0;
    border: none;
    background: transparent;
  }

  .portrait-slider .slide-item.is-active {
    display: block !important;
  }

  .portrait-slider img {
    display: block;
    width: 100%;
    max-height: 380px; /* Adapte la hauteur pour garder le cadrage parfait */
    object-fit: cover;
    object-position: center;
    border-radius: 4px;
  }

  /* Ajustement de la hauteur des flèches */
  .slider-btn {
    top: 50% !important;
    transform: translateY(-50%) !important;
  }
</style>

<body>
  <main>
    <header class="page-hero">
      <div class="container">
        <span class="label gold reveal">Archives des personnages</span>
        <h1 class="reveal">Qui est <em>qui</em> en 1135 ?</h1>
        <p class="lead reveal">Les 63 personnages de la saga, d'après la bible de l'auteur. Choisis un nom dans le registre : avis de recherche, état civil, radiographie, parcours, relations et pièces d'archive. Ce qui dépasse ta lecture reste flouté.
          <button type="button" class="chip" data-open-reading style="vertical-align:middle">Régler ma lecture</button></p>
      </div>
    </header>

    <div class="container dossiers">
      <aside class="registre" aria-label="Registre des personnages">
        <div class="registre-head">
          <h2 class="label">Registre</h2>
          <div class="reg-tabs" id="registre-tabs" role="group" aria-label="Groupes de personnages"></div>
          <label class="search search-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span class="visually-hidden">Chercher un personnage</span>
            <input type="search" id="registre-search" placeholder="Chercher un nom" autocomplete="off">
          </label>
        </div>
        <div id="registre-list" class="registre-list"></div>
      </aside>
      <section id="dossier" class="dossier" aria-live="polite"></section>
    </div>

    <div class="doc-modal" id="doc-modal" role="dialog" aria-modal="true">
      <div class="doc-modal-panel">
        <button type="button" class="pill-btn doc-close">Fermer</button>
        <div id="doc-modal-body"></div>
      </div>
    </div>
  </main>

  <script src="js/vendor/gsap.min.js"></script>

</body>
